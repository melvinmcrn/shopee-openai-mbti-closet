<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FCFAF6">
    <title>MBTI Closet is offline</title>
    <style>
      :root { color-scheme: light; font-family: "Figtree", Arial, sans-serif; color: #302824; background: #FCFAF6; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 342px); }
      h1 { margin: 0 0 12px; font-family: "Bricolage Grotesque", Arial, sans-serif; font-size: 36px; line-height: 1.08; letter-spacing: -0.04em; }
      p { margin: 0; color: #655B54; font-size: 17px; line-height: 1.5; }
      .mark { margin-bottom: 48px; font-family: "Bricolage Grotesque", Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.05em; }
      .mark span { color: #EF5B5B; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">closet<span>.</span></div>
      <h1>You’re offline.</h1>
      <p>Reconnect to open MBTI Closet and sign in.</p>
    </main>
  </body>
</html>
